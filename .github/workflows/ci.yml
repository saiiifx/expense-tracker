name: CI/CD - Build, Push and Deploy

on:
  push:
    branches: [ main ]

env:
  BACKEND_IMAGE: ghcr.io/saiiifx/expense-tracker-backend

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/backend/dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Deploy - restart backend container
        run: |
          docker stop expense-backend || true
          docker rm expense-backend || true
          docker run -d --name expense-backend \
            --restart unless-stopped \
            --network app_default \
            -p 8080:8000 \
            -e DATABASE_URL="postgresql+psycopg2://admin:password123@postgres:5432/admin" \
            ${{ env.BACKEND_IMAGE }}:latest
