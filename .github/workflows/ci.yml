name: CI/CD - Build, Push and Deploy
on:
  push:
    branches: [ main ]
env:
  BACKEND_IMAGE: ghcr.io/saiiifx/expense-tracker-backend
jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/backend/dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
      - name: Docker compose down (stop old stack)
        working-directory: app
        run: |
          echo "Stopping old stack if running..."
          docker compose down || true
          echo "Checking for stuck rootlessport processes on 8080..."
          PID=$(sudo ss -tulpn 2>/dev/null | grep ':8080 ' | grep -oP 'pid=\K[0-9]+' | head -1)
          if [ -n "$PID" ]; then
            echo "Killing stuck process $PID"
            sudo kill -9 "$PID" || true
            sleep 2
          fi
      - name: Docker compose up (deploy new stack)
        working-directory: app
        run: |
          docker compose pull backend || true
          docker compose up -d
      - name: Verify deployment
        run: |
          sleep 5
          docker ps --filter "name=expense-backend" --format "table {{.Names}}\t{{.Status}}"
          curl -I http://localhost:8080 || echo "Warning: health check failed"
