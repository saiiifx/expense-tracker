name: CI/CD - Build, Push and Deploy
on:
  push:
    branches: [ main ]
env:
  BACKEND_IMAGE: ghcr.io/saiiifx/expense-tracker-backend
jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/backend/dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
      - name: Docker compose down
        working-directory: app
        run: docker compose down || true
      - name: Docker compose up
        working-directory: app
        run: docker compose up -d
      - name: Verify deployment
        run: |
          sleep 5
          docker ps --filter "name=expense-backend" --format "table {{.Names}}\t{{.Status}}"
          curl -I http://localhost:8080 || echo "Warning: health check failed"
