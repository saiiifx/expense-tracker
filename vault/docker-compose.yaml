services:
  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
    volumes:
      - /home/aau/Desktop/project2/app/vault-script.sh:/vault-script.sh
      - /home/aau/Desktop/project2/app:/app
    ports:
      - "8200:8200"
    
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        apk add --no-cache jq bash
        vault server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=root &
        until vault status >/dev/null 2>&1; do sleep 1; done
        vault kv put secret/taskapp POSTGRES_USER=admin POSTGRES_PASSWORD=password123 POSTGRES_DB=admin
        cd /app
        /bin/sh /vault-script.sh
        wait

